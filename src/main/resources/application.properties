spring.application.name=neowatch
nasa.api.key=${NASA_API_KEY}

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
# update auto-migrates the RDS schema on every boot; fine while iterating solo, but switch to
# a real migration tool (Flyway/Liquibase) before this touches shared data
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# This Redis Cloud free-tier endpoint uses a plain (non-TLS) connection and ACL-based auth,
# which needs a username (Redis Cloud's default user is literally named "default")
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT}
spring.data.redis.username=default
spring.data.redis.password=${REDIS_PASSWORD}

# All optional, safe defaults so local dev keeps working with zero setup.
# Set before exposing this backend on a public URL.
app.allowed-origins=${ALLOWED_ORIGINS:http://localhost:5173}
app.ingest-key=${INGEST_KEY:}
# Only enable once actually deployed behind a proxy that sets X-Forwarded-For itself
# (Cloudflare, Railway, etc) — otherwise clients can spoof it to dodge rate limiting.
app.trust-proxy-headers=${TRUST_PROXY_HEADERS:false}